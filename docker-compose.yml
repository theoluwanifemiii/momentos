# Docker Compose for MomentOS
# File: docker-compose.yml
# Run with: docker-compose up -d
# Copy .env.example to .env and fill in values before running.

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: momentos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momentos}
      POSTGRES_USER: ${POSTGRES_USER:-momentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: momentos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && npm start"

  # Worker (Scheduler)
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: momentos_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: momentos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: momentos_network
